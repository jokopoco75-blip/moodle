  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--bg:#f4f6fb;--panel:#fff;--text:#1d2638;--muted:#6d788d;--line:#e6eaf1;--brand:#4e5fd4;--brand-dark:#3f4fb9;--soft:#eef0ff;--green:#16845d;--green-bg:#e9f7f0;--red:#bf4657;--amber:#9b6910;--shadow:0 16px 42px #23325012;--radius:18px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}body[data-theme="dark"]{color-scheme:dark;--bg:#111827;--panel:#1b2535;--text:#edf1f8;--muted:#a6b1c4;--line:#303b4d;--brand:#96a3ff;--brand-dark:#acb6ff;--soft:#2a3454;--green:#66d5a8;--green-bg:#193a32;--red:#ff8998;--amber:#f0c26a;--shadow:0 16px 42px #0003}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{color:var(--brand);text-decoration:none}button{color:inherit}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:.86rem}.eyebrow{color:var(--brand);font-size:.76rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.app-shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;padding:2px 8px;font-weight:850;letter-spacing:-.03em;font-size:1.16rem}.brand-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#6475ed,#4355c7);color:#fff;display:grid;place-items:center;font-size:1.15rem;box-shadow:0 8px 18px #4e5fd43c}.side-label{padding:0 10px 8px;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.nav-list{display:grid;gap:5px}.nav-link{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:650;transition:.18s}.nav-link:hover,.nav-link.active{background:var(--soft);color:var(--brand)}.nav-ico{width:22px;text-align:center;font-size:1.05rem}.side-bottom{margin-top:auto;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px}.main{min-width:0}.topbar{height:76px;padding:0 clamp(18px,4vw,52px);display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--bg) 87%,transparent);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}.top-title{font-weight:720}.top-actions{display:flex;align-items:center;gap:10px}.user-chip{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--line)}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-weight:800}.user-name{font-size:.9rem;font-weight:700}.user-role{font-size:.75rem;color:var(--muted)}.content{padding:30px clamp(18px,4vw,52px) 60px;max-width:1440px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h1{font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;margin:7px 0 0;letter-spacing:-.04em}.page-head p{margin:8px 0 0;color:var(--muted);max-width:720px}.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:700;transition:.18s;text-decoration:none}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-dark)}.btn-soft{background:var(--soft);border-color:transparent;color:var(--brand)}.btn-danger{color:var(--red)}.btn-sm{padding:7px 10px;font-size:.85rem;border-radius:9px}.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:1.05rem}.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0}.card h2,.card h3{margin:0 0 8px;letter-spacing:-.02em}.card p{color:var(--muted);line-height:1.55}.stat-card{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.stat-number{font-size:1.9rem;font-weight:850;letter-spacing:-.04em;margin-top:8px}.stat-icon{width:43px;height:43px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:1.2rem}.hero{padding:clamp(22px,4vw,36px);border-radius:24px;background:radial-gradient(circle at 85% 18%,#ffffff3d,transparent 25%),linear-gradient(120deg,#3e4fbd,#737fec);color:#fff;box-shadow:0 16px 38px #4655c733;display:flex;align-items:center;justify-content:space-between;gap:20px}.hero h1{font-size:clamp(1.8rem,3.5vw,2.7rem);margin:8px 0;letter-spacing:-.045em}.hero p{color:#eef0ff;max-width:610px;margin:0;line-height:1.6}.hero-mark{font-size:4rem;opacity:.88;padding:0 16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:30px 0 15px}.section-head h2{margin:0;font-size:1.25rem;letter-spacing:-.02em}.course-card{overflow:hidden;padding:0}.course-band{height:9px;background:var(--course-color,#6475ed)}.course-body{padding:19px}.course-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin:14px 0}.course-card h3{font-size:1.12rem;margin:2px 0 8px}.course-card p{margin:0;min-height:48px}.course-foot{border-top:1px solid var(--line);padding:13px 19px;display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:.76rem;font-weight:750;background:var(--soft);color:var(--brand)}.pill-green{background:var(--green-bg);color:var(--green)}.pill-muted{background:var(--bg);color:var(--muted)}.progress-track{height:8px;border-radius:10px;background:var(--line);overflow:hidden}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#5969df,#6ec6a0)}.progress-row{display:flex;justify-content:space-between;gap:12px;font-size:.83rem;margin:0 0 8px}.form-card{max-width:780px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:.84rem;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.field textarea{min-height:105px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}.form-actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}.auth-screen{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:var(--panel)}.auth-art{padding:clamp(30px,7vw,90px);background:linear-gradient(145deg,#3546a8,#6979eb 72%,#91a0ff);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh}.auth-art h1{font-size:clamp(2.4rem,5vw,4.2rem);line-height:1.02;letter-spacing:-.055em;max-width:670px;margin:18px 0}.auth-art p{color:#e9ecff;max-width:600px;line-height:1.7;font-size:1.05rem}.auth-logo{font-weight:850;font-size:1.1rem;display:flex;gap:12px;align-items:center}.auth-box-wrap{display:grid;place-items:center;padding:30px}.auth-box{width:min(440px,100%)}.auth-box h2{font-size:1.85rem;margin:0 0 6px;letter-spacing:-.04em}.demo-box{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:18px;color:var(--muted);font-size:.82rem;line-height:1.65}.demo-box strong{color:var(--text)}.notice{border-radius:12px;padding:12px 14px;background:var(--soft);color:var(--brand);line-height:1.5}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.empty strong{display:block;color:var(--text);margin-bottom:6px}.section-block{margin:14px 0}.material-row,.list-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.material-row:last-child,.list-row:last-child{border-bottom:0}.material-icon{width:38px;height:38px;flex:0 0 auto;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--brand)}.material-main{flex:1;min-width:0}.material-main strong{display:block}.material-main p{margin:4px 0 0;font-size:.86rem}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{background:var(--bg);font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}tr:last-child td{border-bottom:0}.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline-form input,.inline-form select{border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:var(--bg);color:var(--text)}.quiz-question{padding:15px 0;border-bottom:1px solid var(--line)}.quiz-question:last-child{border:0}.quiz-question strong{display:block;margin-bottom:10px}.choice{display:flex;align-items:flex-start;gap:9px;padding:7px 4px;color:var(--muted)}.choice input{margin-top:4px;accent-color:var(--brand)}.toast{position:fixed;right:22px;bottom:22px;z-index:20;max-width:min(420px,calc(100vw - 40px));padding:13px 17px;border-radius:13px;background:var(--text);color:var(--panel);box-shadow:0 12px 35px #0003;animation:appear .2s ease}.toast.error{background:var(--red);color:white}@keyframes appear{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.mobile-brand{display:none}
    @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){.app-shell{display:block}.sidebar{position:static;width:100%;height:auto;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.brand{padding:0 4px}.side-label,.side-bottom{display:none}.nav-list{display:flex;overflow-x:auto;gap:5px;padding-bottom:2px}.nav-link{white-space:nowrap;padding:9px 10px;font-size:.85rem}.nav-ico{width:auto}.topbar{height:62px;padding:0 16px}.top-title{display:none}.user-name{display:none}.content{padding:22px 16px 44px}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.hero{align-items:flex-start}.hero-mark{display:none}.auth-screen{grid-template-columns:1fr}.auth-art{display:none}.auth-box-wrap{min-height:100vh;padding:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.user-chip{padding-left:8px}}
    @media(min-width:761px) and (max-width:980px){.app-shell{grid-template-columns:210px minmax(0,1fr)}.sidebar{padding-inline:12px}.user-name{max-width:125px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
    .language-select select{max-width:138px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit;font-size:.82rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.file-preview{width:100%;height:min(72vh,850px);border:1px solid var(--line);border-radius:12px;background:#fff}.file-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto;padding:18px;background:var(--bg);border:1px solid var(--line);border-radius:12px;line-height:1.65}@media(max-width:760px){.language-select select{max-width:104px;padding-inline:6px;font-size:.74rem}.top-actions{gap:6px}}
    .tutor-card{max-width:960px}.tutor-chat{display:grid;gap:12px;max-height:54vh;min-height:170px;overflow:auto;margin:18px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}.tutor-message{max-width:min(82%,720px);padding:12px 14px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);overflow-wrap:anywhere}.tutor-message p{margin:5px 0 0;color:var(--text);white-space:pre-wrap;line-height:1.55}.tutor-message span{font-size:.74rem;font-weight:800;color:var(--muted)}.tutor-user{justify-self:end;background:var(--soft)}.tutor-assistant{justify-self:start}.section-head h2{overflow-wrap:anywhere}@media(max-width:600px){.tutor-message{max-width:96%}}
  </style>

<body>
  <div id="app" class="splash" role="status">Запускаем учебную платформу…</div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <script>
  'use strict';

  /* ============================== Utils ============================== */
  const tutorHistory=[];
  let tutorCourseContext='';
  const Utils = {
    esc(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); },
    id(prefix='id') { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`; },
    safeColor(value) { return /^#[0-9a-f]{6}$/i.test(String(value||''))?String(value):'#6879e8'; },
    async hashPassword(value) {
      const bytes = new TextEncoder().encode(String(value));
      if (globalThis.crypto?.subtle) {
        const digest = await crypto.subtle.digest('SHA-256',bytes);
        return Array.from(new Uint8Array(digest),n=>n.toString(16).padStart(2,'0')).join('');
      }
      let hash=2166136261; for(const byte of bytes) hash=Math.imul(hash^byte,16777619);
      return `local-${(hash>>>0).toString(16)}`;
    },
    async blobBase64(blob) {
      const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';
      for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
      return btoa(binary);
    },
    base64Blob(value,mime='application/octet-stream') {
      const binary=atob(String(value));const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      return new Blob([bytes],{type:mime});
    },
    date(value) { if(!value)return '—'; const d=new Date(`${value}`.length===10?`${value}T12:00:00`:value); const locale=({ru:'ru-RU',en:'en-US',ko:'ko-KR',pl:'pl-PL',kk:'kk-KZ'})[I18n.lang]||'ru-RU'; return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat(locale,{day:'numeric',month:'long',year:'numeric'}).format(d); },
    initials(value) { return String(value||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toLocaleUpperCase('ru-RU')||'У'; },
    roleName(role) { return ({admin:'Администратор',teacher:'Преподаватель',student:'Студент'})[role]||'Пользователь'; },
    async readForm(form) { return Object.fromEntries(new FormData(form).entries()); },
    validCompleted(record) { const reflections=record?.reflections||{};const mastery=record?.masteryScores||{};return (record?.completedMaterialIds||[]).filter(id=>String(reflections[id]||'').trim().length>=12&&(Number(mastery[id])>=70||(!mastery[id]&&String(reflections[id]||'').trim().length>=25))); },
    addTutorMessage(role,text) { tutorHistory.push({role,text:String(text||'').slice(0,4000)});if(tutorHistory.length>40)tutorHistory.splice(0,tutorHistory.length-40); },
    getTutorHistory() { return tutorHistory.slice(); },
    tutorCourse() { return tutorCourseContext; },
    setTutorCourse(id) { tutorCourseContext=String(id||''); },
    tutorReply(message,role,course,materials=[]) {
      const lang=I18n.lang||'ru';const raw=String(message||'').toLowerCase();const material=materials.find(item=>raw.includes(String(item.title||'').toLowerCase()))||materials[0]||null;const topic=material?.title||course||'текущая тема';
      const isTeacher=role==='teacher'||role==='admin';const wantsHint=/(подсказ|hint|힌트|wskaz|көмек)/i.test(raw);const wantsPlan=/(план|plan|계획|planie|жоспар)/i.test(raw);const wantsExplain=/(объяс|explain|설명|wyjaś|түсін)/i.test(raw);const wantsRubric=/(критер|rubric|평가기준|kryteri|бағалау)/i.test(raw);const wantsLesson=/(урок|lesson|lekcj|수업|сабақ)/i.test(raw);
      const replies={
        ru:{studentHint:`Давай разберём тему «${topic}» по шагам. Сначала назови, что уже известно и что требуется найти. Пришли свою первую попытку — я подскажу следующий шаг, не выдавая готовое решение.`,studentPlan:`План занятий по курсу «${course||topic}»: 1) 10 минут повтори материал «${topic}». 2) Закрой конспект и объясни главную идею своими словами. 3) Реши один пример и сравни результат с правилом.`,studentExplain:`Разберём «${topic}» простыми шагами: сначала выдели главную идею, затем найди пример из материала и попробуй объяснить его своими словами. Какая часть вызывает больше всего вопросов?`,studentDefault:`Я помогу разобраться в курсе «${course||topic}»: могу объяснить тему, дать подсказку или составить план повторения. Напиши, что ты уже попробовал и где остановился — начнём с одного небольшого шага.`,teacherRubric:`Для задания по курсу «${course||topic}» можно использовать рубрику на 100 баллов: соответствие цели — 40, обоснование решения — 30, ясность и оформление — 20, самостоятельная проверка — 10. Добавьте к каждому критерию короткий пример уровня «хорошо».`,teacherLesson:`План занятия по курсу «${course||topic}»: 1) обозначьте цель и вопрос для разогрева; 2) покажите короткий пример по теме «${topic}»; 3) дайте практику с постепенным усложнением; 4) завершите вопросом на самопроверку. Для каждого этапа заранее задайте ожидаемый результат.`,teacherPlan:`Для курса «${course||topic}» начните с измеримого результата обучения. Затем подготовьте короткое объяснение, пример, самостоятельную практику и критерии обратной связи. Тему «${topic}» можно проверить небольшим заданием с понятным ожидаемым результатом.`,teacherDefault:`Помогу подготовить материал по курсу «${course||topic}»: могу предложить структуру урока, критерии оценивания или варианты заданий разного уровня. Укажите тему и возраст/уровень группы — предложу конкретный вариант.`},
        en:{studentHint:`Let's work through “${topic}” one step at a time. First write what is known and what needs to be found. Send your first attempt and I’ll give the next hint without giving away the full solution.`,studentPlan:`Study plan for “${course||topic}”: 1) Review “${topic}” for 10 minutes. 2) Close your notes and explain the main idea in your own words. 3) Solve one example and check it against the rule.`,studentExplain:`Let’s understand “${topic}” in simple steps: identify the main idea, find an example in the material, then explain it in your own words. Which part is confusing?`,studentDefault:`I can help with “${course||topic}” by explaining a topic, giving a hint, or making a review plan. Tell me what you tried and where you got stuck; we’ll take one small step at a time.`,teacherRubric:`For “${course||topic}”, try a 100-point rubric: alignment with the learning goal — 40, reasoning — 30, clarity and presentation — 20, self-checking — 10. Add a brief example of what good work looks like for each criterion.`,teacherLesson:`Lesson outline for “${course||topic}”: 1) state the goal and a warm-up question; 2) demonstrate a short example on “${topic}”; 3) guide practice from easy to harder; 4) close with a self-check question. Define the expected outcome for each step.`,teacherPlan:`For “${course||topic}”, start with a measurable learning outcome. Then prepare a short explanation, example, independent practice, and feedback criteria. Use a small task with a clear expected result to check “${topic}”.`,teacherDefault:`I can help prepare material for “${course||topic}”: a lesson outline, assessment criteria, or differentiated task ideas. Share the topic and learners’ level for a concrete suggestion.`},
        ko:{studentHint:`“${topic}”을 한 단계씩 살펴봐요. 먼저 알고 있는 것과 구해야 하는 것을 적어 보세요. 첫 시도를 보내면 정답을 바로 주지 않고 다음 힌트를 드릴게요.`,studentPlan:`“${course||topic}” 학습 계획: 1) “${topic}”을 10분 복습하세요. 2) 노트를 덮고 핵심을 자기 말로 설명하세요. 3) 예제를 하나 풀고 규칙과 비교하세요.`,studentExplain:`“${topic}”을 쉽게 이해해 봅시다. 핵심을 찾고 자료의 예제를 확인한 뒤 자기 말로 설명해 보세요. 어느 부분이 가장 헷갈리나요?`,studentDefault:`“${course||topic}” 학습을 도울게요. 주제 설명, 힌트, 복습 계획을 제공할 수 있어요. 어디까지 해 보았고 어디에서 막혔는지 알려 주세요.`,teacherRubric:`“${course||topic}” 과제에 100점 기준을 사용해 보세요: 학습 목표 부합 40, 근거와 추론 30, 명확성과 구성 20, 자기 점검 10. 각 기준에 좋은 결과의 예를 덧붙이세요.`,teacherLesson:`“${course||topic}” 수업 구성: 1) 목표와 도입 질문 제시; 2) “${topic}”의 짧은 예시 시연; 3) 쉬운 것부터 단계별 연습; 4) 자기 점검 질문으로 마무리. 각 단계의 기대 결과를 정하세요.`,teacherPlan:`“${course||topic}”의 측정 가능한 학습 결과를 먼저 정하세요. 짧은 설명, 예시, 개별 연습, 피드백 기준을 준비하고 “${topic}”을 작은 과제로 확인하세요.`,teacherDefault:`“${course||topic}”을 위한 수업 구성, 평가 기준, 수준별 과제를 도울 수 있어요. 주제와 학습자 수준을 알려 주시면 구체적으로 제안할게요.`},
        pl:{studentHint:`Przejdźmy przez „${topic}” krok po kroku. Najpierw zapisz, co już wiadomo i czego trzeba się dowiedzieć. Wyślij swoją próbę, a podpowiem kolejny krok bez podawania gotowego rozwiązania.`,studentPlan:`Plan nauki „${course||topic}”: 1) Powtórz „${topic}” przez 10 minut. 2) Zamknij notatki i wyjaśnij główną myśl własnymi słowami. 3) Rozwiąż jeden przykład i porównaj go z zasadą.`,studentExplain:`Wyjaśnijmy „${topic}” prostymi krokami: znajdź główną myśl, odszukaj przykład w materiale i opisz go własnymi słowami. Która część sprawia trudność?`,studentDefault:`Pomogę w nauce „${course||topic}”: mogę wyjaśnić temat, podać wskazówkę lub ułożyć plan powtórki. Napisz, co już próbujesz i gdzie utknąłeś.`,teacherRubric:`Dla „${course||topic}” zastosuj rubrykę na 100 punktów: zgodność z celem — 40, uzasadnienie — 30, jasność i forma — 20, samodzielna kontrola — 10. Dodaj krótki przykład dobrej pracy dla każdego kryterium.`,teacherLesson:`Plan lekcji „${course||topic}”: 1) przedstaw cel i pytanie na rozgrzewkę; 2) pokaż przykład dotyczący „${topic}”; 3) poprowadź ćwiczenia od łatwych do trudniejszych; 4) zakończ pytaniem do samooceny. Określ oczekiwany rezultat każdego etapu.`,teacherPlan:`Dla „${course||topic}” zacznij od mierzalnego efektu uczenia się. Przygotuj krótkie wyjaśnienie, przykład, samodzielne ćwiczenie i kryteria informacji zwrotnej. „${topic}” sprawdź krótkim zadaniem z jasnym wynikiem.`,teacherDefault:`Mogę pomóc przygotować materiały do „${course||topic}”: plan lekcji, kryteria oceniania lub zadania na różnych poziomach. Podaj temat i poziom grupy. `},
        kk:{studentHint:`«${topic}» тақырыбын қадам-қадаммен қарайық. Алдымен не белгілі және нені табу керегін жазыңыз. Алғашқы талпынысыңызды жіберіңіз — дайын жауап бермей, келесі ишараны ұсынамын.`,studentPlan:`«${course||topic}» курсына оқу жоспары: 1) «${topic}» материалын 10 минут қайталаңыз. 2) Конспектіні жауып, негізгі ойды өз сөзіңізбен түсіндіріңіз. 3) Бір мысалды шығарып, ережемен салыстырыңыз.`,studentExplain:`«${topic}» тақырыбын түсінейік: негізгі ойды анықтаңыз, материалдан мысал табыңыз да, оны өз сөзіңізбен айтыңыз. Қай бөлігі түсініксіз?`,studentDefault:`«${course||topic}» пәнін түсінуге көмектесемін: түсіндіру, ишара немесе қайталау жоспарын бере аламын. Не істеп көргеніңізді және қай жерде тоқтағаныңызды жазыңыз.`,teacherRubric:`«${course||topic}» тапсырмасына 100 балдық рубрика қолданыңыз: оқу мақсатына сәйкестік — 40, дәлелдеу — 30, анықтық пен рәсімдеу — 20, өзіндік тексеру — 10. Әр өлшемге жақсы жұмыстың қысқа мысалын қосыңыз.`,teacherLesson:`«${course||topic}» сабағы: 1) мақсат пен кіріспе сұрақ; 2) «${topic}» бойынша қысқа мысал; 3) жеңілден күрделіге қарай жаттығу; 4) өзіндік тексеру сұрағы. Әр кезеңнің күтілетін нәтижесін белгілеңіз.`,teacherPlan:`«${course||topic}» үшін өлшенетін оқу нәтижесін анықтаңыз. Қысқа түсіндірме, мысал, жеке жаттығу және кері байланыс өлшемдерін дайындаңыз. «${topic}» тақырыбын нақты нәтижесі бар шағын тапсырмамен тексеріңіз.`,teacherDefault:`«${course||topic}» үшін сабақ жоспарын, бағалау өлшемдерін немесе деңгейлік тапсырмаларды дайындауға көмектесемін. Тақырып пен топ деңгейін жазыңыз.`}
      };
      const t=replies[lang]||replies.ru;const key=isTeacher?(wantsRubric?'teacherRubric':wantsLesson?'teacherLesson':wantsPlan?'teacherPlan':'teacherDefault'):(wantsHint?'studentHint':wantsPlan?'studentPlan':wantsExplain?'studentExplain':'studentDefault');const source=String(material?.content||material?.description||'').trim();const words=raw.match(/[\p{L}\p{N}]{4,}/gu)||[];const excerpt=source.split(/(?<=[.!?…])\s+|\n+/).find(sentence=>words.some(word=>sentence.toLowerCase().includes(word)))||source.split(/(?<=[.!?…])\s+|\n+/)[0]||'';const contextLine=({ru:`\n\nИз учебного материала «${topic}»: `,en:`\n\nFrom the course material “${topic}”: `,ko:`\n\n강의 자료 “${topic}”에서: `,pl:`\n\nZ materiału „${topic}”: `,kk:`\n\n«${topic}» оқу материалынан: `})[lang]||'';return t[key]+(excerpt?contextLine+excerpt.slice(0,320):'');
    },
    toast(message,type='') {
      document.querySelector('.toast')?.remove(); const node=document.createElement('div'); node.className=`toast ${type}`; node.setAttribute('role','status'); node.textContent=I18n.exact(String(message)); document.body.append(node); setTimeout(()=>node.remove(),3400);
    },
    byId(id) { return document.getElementById(id); }
  };

  const I18n = (()=>{
    const codes=['en','ko','pl','kk'];
    const phrases={
      'Для небольших образовательных организаций':['For small educational organizations','소규모 교육 기관을 위한','Dla małych placówek edukacyjnych','Шағын білім беру ұйымдарына арналған'],'Короткие курсы на казахском языке.':['Short courses in Kazakh.','카자흐어로 된 짧은 강좌.','Krótkie kursy po kazachsku.','Қазақ тіліндегі қысқа курстар.'],'ИИ превращает учебные материалы в конспекты и интерактивные тесты, которые преподаватель проверяет перед публикацией.':['AI turns learning materials into notes and interactive quizzes that teachers review before publishing.','AI가 학습 자료를 요약과 대화형 퀴즈로 만들며 교사가 게시 전에 검토합니다.','AI zamienia materiały w notatki i interaktywne testy, które nauczyciel sprawdza przed publikacją.','AI оқу материалдарын конспект пен интерактивті тесттерге айналдырады, ал оқытушы жарияламас бұрын тексереді.'],
      'ИИ-репетитор':['AI tutor','AI 튜터','Tutor AI','AI репетитор'],'Учебный помощник':['Study assistant','학습 도우미','Asystent nauki','Оқу көмекшісі'],'Открыть задание':['Open assignment','과제 열기','Otwórz zadanie','Тапсырманы ашу'],'Задание по предметам':['Assignments by course','강좌별 과제','Zadania według kursu','Пән бойынша тапсырмалар'],'Начните с открытия нужного задания.':['Open an assignment to read it and submit your answer.','과제를 열어 내용을 확인하고 답안을 제출하세요.','Otwórz zadanie, aby je przeczytać i wysłać odpowiedź.','Тапсырманы ашып, оқып, жауабыңызды жіберіңіз.'],'Открыть материал':['Open material','자료 열기','Otwórz materiał','Материалды ашу'],'Материал изучен':['Material studied','자료 학습 완료','Materiał przerobiony','Материал оқылды'],'Пока рано завершать':['Not ready to finish yet','아직 완료할 수 없습니다','Jeszcze nie można zakończyć','Әзірге аяқтауға болмайды'],'Дочитайте материал до конца, проведите на странице не менее 25 секунд и напишите короткое объяснение своими словами.':['Read to the end, spend at least 25 seconds on the page, and write a short explanation in your own words.','끝까지 읽고 페이지에서 25초 이상 머문 뒤 자신의 말로 짧게 설명하세요.','Przeczytaj materiał do końca, spędź na stronie co najmniej 25 sekund i krótko wyjaśnij go własnymi słowami.','Материалды соңына дейін оқып, бетте кемінде 25 секунд болып, өз сөзіңізбен қысқаша түсіндіріңіз.'],'Что вы поняли из материала? Напишите не менее 25 символов.':['What did you learn from this material? Write at least 25 characters.','자료에서 무엇을 배웠나요? 25자 이상 작성하세요.','Czego nauczył Cię ten materiał? Napisz co najmniej 25 znaków.','Бұл материалдан не түсіндіңіз? Кемінде 25 таңба жазыңыз.'],'Завершить изучение':['Finish studying','학습 완료','Zakończ naukę','Оқуды аяқтау'],'Осталось секунд:':['Seconds remaining:','남은 시간(초):','Pozostało sekund:','Қалған секунд:'],'Прокрутите до конца страницы.':['Scroll to the bottom of the page.','페이지 맨 아래까지 스크롤하세요.','Przewiń na dół strony.','Беттің соңына дейін айналдырыңыз.'],'ИИ-помощник работает локально по учебным подсказкам; сообщения не отправляются в интернет.':['This tutor runs locally using guided learning prompts; messages are not sent online.','이 튜터는 학습 안내를 로컬에서 제공합니다. 메시지는 인터넷으로 전송되지 않습니다.','Ten tutor działa lokalnie, korzystając ze wskazówek edukacyjnych; wiadomości nie są wysyłane do internetu.','Бұл репетитор оқу ишараларын жергілікті түрде ұсынады; хабарлар интернетке жіберілмейді.'],'Выберите курс':['Choose a course','강좌 선택','Wybierz kurs','Курс таңдаңыз'],'Спросите о теме, попросите подсказку или план обучения.':['Ask about a topic, request a hint, or get a study plan.','주제에 대해 묻거나 힌트 또는 학습 계획을 요청하세요.','Zapytaj o temat, poproś o wskazówkę lub plan nauki.','Тақырып туралы сұраңыз, ишара не оқу жоспарын сұраңыз.'],'Ваш вопрос':['Your question','질문','Twoje pytanie','Сұрағыңыз'],'Отправить вопрос':['Send question','질문 보내기','Wyślij pytanie','Сұрақ жіберу'],'Объясни тему простыми словами':['Explain the topic in simple words','주제를 쉽게 설명해 주세요','Wyjaśnij temat prostymi słowami','Тақырыпты қарапайым тілмен түсіндір'],'Дай подсказку, не готовый ответ':['Give me a hint, not the full answer','정답 말고 힌트를 주세요','Podaj wskazówkę, nie gotową odpowiedź','Дайын жауап емес, ишара бер'],'Составь план повторения':['Make a review plan','복습 계획을 세워 주세요','Ułóż plan powtórki','Қайталау жоспарын жаса'],'Подготовь критерии оценивания':['Prepare grading criteria','평가 기준을 만들어 주세요','Przygotuj kryteria oceniania','Бағалау өлшемдерін дайында'],'Составь план урока':['Create a lesson plan','수업 계획을 만들어 주세요','Ułóż plan lekcji','Сабақ жоспарын жаса'],'Напишите краткое объяснение своими словами.':['Write a short explanation in your own words.','자신의 말로 짧게 설명하세요.','Napisz krótkie wyjaśnienie własnymi słowami.','Өз сөзіңізбен қысқаша түсіндіріңіз.'],'Материал завершён: сначала откройте его, прочитайте до конца и подтвердите понимание.':['To complete material, open it, read to the end, and show your understanding.','자료를 완료하려면 열어서 끝까지 읽고 이해한 내용을 작성하세요.','Aby ukończyć materiał, otwórz go, przeczytaj do końca i potwierdź zrozumienie.','Материалды аяқтау үшін оны ашып, соңына дейін оқып, түсінгеніңізді көрсетіңіз.'],
      'Помощник поможет учиться шаг за шагом и не будет выдавать готовый ответ.':['The tutor helps you learn step by step and will not give away full answers.','튜터가 단계별 학습을 돕고 정답을 그대로 제공하지 않습니다.','Tutor pomaga uczyć się krok po kroku i nie podaje gotowych odpowiedzi.','Репетитор қадам-қадаммен оқуға көмектеседі және дайын жауапты бермейді.'],'Помощник предлагает структуру урока, обратную связь и критерии оценивания.':['The tutor suggests lesson structure, feedback, and grading criteria.','튜터가 수업 구성, 피드백, 평가 기준을 제안합니다.','Tutor proponuje strukturę lekcji, informację zwrotną i kryteria oceniania.','Репетитор сабақ құрылымын, кері байланыс пен бағалау өлшемдерін ұсынады.'],'Задания сгруппированы по курсам. Откройте работу, чтобы посмотреть ответы и оценить их.':['Assignments are grouped by course. Open one to review submissions and grade them.','과제가 강좌별로 묶여 있습니다. 과제를 열어 제출물을 확인하고 채점하세요.','Zadania są pogrupowane według kursu. Otwórz je, aby sprawdzić i ocenić prace.','Тапсырмалар курс бойынша топтастырылған. Жауаптарды қарап, бағалау үшін ашыңыз.'],'Задание · предмет':['Assignment · subject','과제 · 과목','Zadanie · przedmiot','Тапсырма · пән'],'Самопроверка перед завершением':['Self-check before completion','완료 전 자기 점검','Samoocena przed zakończeniem','Аяқтау алдындағы өзіндік тексеру'],'Можно завершить изучение.':['You can finish studying now.','이제 학습을 완료할 수 있습니다.','Możesz teraz zakończyć naukę.','Оқуды аяқтауға болады.'],'Подождите, пока таймер разрешит завершить изучение.':['Wait for the timer before finishing.','타이머가 완료를 허용할 때까지 기다리세요.','Poczekaj, aż upłynie wymagany czas.','Таймер аяқтауға рұқсат бергенше күтіңіз.'],'Материал изучен, прогресс обновлён.':['Material studied; progress updated.','자료 학습 완료, 진행률이 업데이트되었습니다.','Materiał przerobiony; postęp zaktualizowany.','Материал оқылды, ілгерілеу жаңартылды.'],'Ожидает сдачи':['Not submitted','미제출','Do oddania','Тапсырылмаған'],'Открывайте материалы, дочитывайте их и подтверждайте понимание — прогресс обновится автоматическ     let lang='ru';
    function set(code){lang=['ru',...codes].includes(code)?code:'ru';try{localStorage.setItem('course-platform-language',lang);}catch{}document.documentElement.lang=lang;}
    function load(){try{set(localStorage.getItem('course-platform-language')||'ru');}catch{set('ru');}}
    function exact(text){if(lang==='ru')return text;const index=codes.indexOf(lang);return phrases[text]?.[index]||text;}
    function apply(root){
      if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
      for(const node of nodes){if(node.parentElement?.closest('.file-text'))continue;const raw=node.nodeValue;const trimmed=raw.trim();if(!trimmed)continue;const translated=exact(trimmed);if(translated!==trimmed)node.nodeValue=raw.replace(trimmed,translated);}
      root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{for(const attr of ['placeholder','title','aria-label'])if(el.hasAttribute(attr))el.setAttribute(attr,exact(el.getAttribute(attr)));});
      document.title=exact('Курсор — учебная платформа');
    }
    function select(){return `<label class="language-select"><span class="sr-only">${exact('Язык интерфейса')}</span><select data-language aria-label="${exact('Язык интерфейса')}"><option value="ru" ${lang==='ru'?'selected':''}>Русский</option><option value="en" ${lang==='en'?'selected':''}>English</option><option value="ko" ${lang==='ko'?'selected':''}>한국어</option><option value="pl" ${lang==='pl'?'selected':''}>Polski</option><option value="kk" ${lang==='kk'?'selected':''}>Қазақша</option></select></label>`;}
    load();return {get lang(){return lang;},set,apply,exact,select};
  })();

  async function apiRequest(path,options={}) {
    const headers={...(options.body!==undefined?{'Content-Type':'application/json'}:{}),...(options.headers||{})};
    const response=await fetch(path,{...options,headers,credentials:'same-origin'});
    let data=null;try{data=await response.json();}catch{}
    if(!response.ok){const error=new Error(data?.error||`Request failed (${response.status})`);error.status=response.status;throw error;}
    return data;
  }

  /* ============================== Store ============================== */
  const Store = (()=>{
    const names=['users','courses','enrollments','sections','materials','assignments','submissions','quizzes','attempts','progress','summaries','ai_quizzes','ai_chats','settings'];
    const pathFor=(name,id)=>`/api/${encodeURIComponent(name)}${id?`/${encodeURIComponent(id)}`:''}`;
    function hydrate(name,record){if(name==='materials'&&record&&typeof record.fileBase64==='string'){record.fileBlob=Utils.base64Blob(record.fileBase64,record.mimeType||'application/octet-stream');delete record.fileBase64;}return record;}
    async function all(name){const value=await apiRequest(pathFor(name));if(!Array.isArray(value))throw new Error('Сервер вернул неверный список данных.');return value;}
    async function get(name,id){try{const record=await apiRequest(pathFor(name,id));if(name==='materials'&&record.hasFile){const response=await fetch(`/api/materials/${encodeURIComponent(id)}/file`,{credentials:'same-origin'});if(!response.ok)throw new Error('Не удалось загрузить файл материала.');record.fileBlob=await response.blob();}return hydrate(name,record);}catch(error){if(error.status===404)return null;throw error;}}
    async function put(name,record){const copy={...record};if(name==='materials'&&copy.fileBlob instanceof Blob){copy.fileBase64=await Utils.blobBase64(copy.fileBlob);delete copy.fileBlob;copy.hasFile=true;}if(!copy.id)copy.id=Utils.id(name.slice(0,-1));return apiRequest(pathFor(name,copy.id),{method:'PUT',body:JSON.stringify(copy)});}
    async function remove(name,id){return apiRequest(pathFor(name,id),{method:'DELETE'});}
    async function init(){await apiRequest('/api/health');return true;}
    async function importData(payload){return apiRequest('/api/admin/import',{method:'POST',body:JSON.stringify(payload)});}
    async function adminCreateUser(payload){return apiRequest('/api/admin/users',{method:'POST',body:JSON.stringify(payload)});}
    async function updateRole(userId,role){return apiRequest(`/api/admin/users/${encodeURIComponent(userId)}/role`,{method:'PATCH',body:JSON.stringify({role})});}
    async function updateProfile(payload){return apiRequest('/api/profile',{method:'PUT',body:JSON.stringify(payload)});}
    async function completeStudy(materialId,reflection){return apiRequest(`/api/study/${encodeURIComponent(materialId)}/complete`,{method:'POST',body:JSON.stringify({reflection})});}
    async function ai(mode,payload){return apiRequest(`/api/ai/${encodeURIComponent(mode)}`,{method:'POST',body:JSON.stringify(payload)});}
    async function aiStatus(){return apiRequest('/api/ai/status');}
    async function approveQuiz(id){return apiRequest(`/api/teacher/quizzes/${encodeURIComponent(id)}/approve`,{method:'POST',body:'{}'});}
    async function submitAssignment(id,payload){return apiRequest(`/api/assignments/${encodeURIComponent(id)}/submissions`,{method:'POST',body:JSON.stringify(payload)});}
    async function gradeSubmission(id,payload){return apiRequest(`/api/teacher/submissions/${encodeURIComponent(id)}/grade`,{method:'PATCH',body:JSON.stringify(payload)});}
    async function submitQuiz(id,payload){return apiRequest(`/api/quizzes/${encodeURIComponent(id)}/attempts`,{method:'POST',body:JSON.stringify(payload)});}
    async function gradebook(courseId){return apiRequest(`/api/teacher/courses/${encodeURIComponent(courseId)}/gradebook`);}
    return {names,init,all,get,put,remove,importData,adminCreateUser,updateRole,updateProfile,completeStudy,ai,aiStatus,approveQuiz,submitAssignment,gradeSubmission,submitQuiz,gradebook};
  })();

  /* ============================== Auth ============================== */
  const Auth = (()=>{
    let current=null;
    async function currentUser(){const response=await apiRequest('/api/auth/session');current=response.user||null;return current;}
    async function login(email,password){const response=await apiRequest('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});current=response.user;return current;}
    async function register(name,email,password){const response=await apiRequest('/api/auth/register',{method:'POST',body:JSON.stringify({name,email,password})});current=response.user;return current;}
    async function logout(){try{await apiRequest('/api/auth/logout',{method:'POST',body:'{}'});}finally{current=null;}}
    function setCurrent(user){current=user||null;}
    return {currentUser,login,register,logout,setCurrent};
  })();

  /* ============================== Router ============================== */
  const Router = (()=>{
    let started=false;
    function route(){const parts=(location.hash.replace(/^#\/?/, '').split('/').filter(Boolean));return {name:parts[0]||'dashboard',id:parts[1]||''};}
    function go(path){const next=`#/${String(path||'dashboard').replace(/^\/+/, '')}`;if(location.hash===next)render();else location.hash=next;}
    async function render(){
      const root=Utils.byId('app');if(!root)return;
      try{
        const user=await Auth.currentUser();const active=route();
        if(!user&&active.name!=='login'){location.hash='#/login';return;}
        if(user&&active.name==='login'){location.hash='#/dashboard';return;}
        if(user&&active.name==='admin'&&user.role!=='admin'){location.hash='#/dashboard';return;}
        root.innerHTML=user?await Views.layout(user,active):Views.login(false);root.classList.remove('splash');I18n.apply(root);
        document.body.dataset.theme=localStorage.getItem('course-platform-theme')||'light';
      }catch(error){console.error('Ошибка отображения страницы:',error);root.classList.remove('splash');root.innerHTML=`<main class="content"><div class="card"><h1>Не удалось открыть страницу</h1><p>${Utils.esc(error.message||'Неизвестная ошибка')}</p><button class="btn btn-primary" data-action="reload">Попробовать снова</button></div></main>`;I18n.apply(root);}
    }
    function start(){if(started)return;started=true;window.addEventListener('hashchange',render);if(!location.hash)location.hash='#/dashboard';else render();}
    return {route,go,render,start};
  })();

    const nav=[['dashboard','⌂','Главная'],['courses','▦','Курсы'],['assignments','✓','Задания'],['tutor','✦','ИИ-репетитор'],['quizzes','◉','Тесты'],['grades','▤','Журнал оценок'],['progress','◴','Мой прогресс']];
    const esc=Utils.esc;

    async function layout(user,active){

    function pageHead(kicker,title,description='',action=''){return `<div class="page-head"><div><span class="eyebrow">${kicker}</span><h1>${title}</h1>${description?`<p>${description}</p>`:''}</div>${action}</div>`;}
    function empty(title,description){return `<div class="empty"><strong>${title}</strong>${description}</div>`;}
    function courseCard(course,enrolled,user){return `<article class="card course-card"><div class="course-band" style="--course-color:${esc(Utils.safeColor(course.color))}"></div><div class="course-body"><span class="eyebrow">Курс</span><h3>${esc(course.title)}</h3><p>${esc(course.description||'Описание пока не добавлено.')}</p><div class="course-meta"><span>◫ ${esc(course.teacherName||'Преподаватель')}</span><span>•</span><span>${Number(course.sectionCount)||0} разделов</span></div></div><div class="course-foot">${enrolled?'<span class="pill pill-green">Вы записаны</span>':'<span class="pill pill-muted">Открытая запись</span>'}<a class="btn btn-sm btn-soft" href="#/course/${encodeURIComponent(course.id)}">Открыть курс</a></div></article>`;}
    async function pageContent(user,active){
      if(active.name!=='material'&&materialPreviewUrl){URL.revokeObjectURL(materialPreviewUrl);materialPreviewUrl='';}
      if(active.name==='dashboard')return dashboard(user);
      if(active.name==='courses')return courses(user);
      if(active.name==='course')return courseDetail(user,active.id);
      if(active.name==='material')return materialPage(user,active.id);
      if(active.name==='assignments')return assignments(user);
      if(active.name==='assignment')return assignmentPage(user,active.id);
      if(active.name==='tutor')return tutor(user);
      if(active.name==='quizzes')return quizzes(user);
      if(active.name==='quiz')return quizPage(user,active.id);
      if(active.name==='grades')return grades(user);
      if(active.name==='progress')return progress(user);
      if(active.name==='profile')return profile(user);
      if(active.name==='admin'&&user.role==='admin')return admin(user);
      return dashboard(user);
    }
    async function records(){const names=Store.names;const out={};for(const n of names)out[n]=await Store.all(n);return out;}
    async function courseDecorate(courses,data){return Promise.all(courses.map(async c=>({...c,teacherName:data.users.find(u=>u.id===c.teacherId)?.name||'Преподаватель',sectionCount:data.sections.filter(s=>s.courseId===c.id).length})));}
    async function dashboard(user){
      const d=await records();const isStudent=user.role==='student';const enroll=d.enrollments.filter(e=>e.userId===user.id);const myCourses=isStudent?d.courses.filter(c=>enroll.some(e=>e.courseId===c.id)):d.courses.filter(c=>user.role==='admin'||c.teacherId===user.id);const decorated=await courseDecorate(myCourses,d);
      const myAssignments=d.assignments.filter(a=>myCourses.some(c=>c.id===a.courseId));const mySubmissions=d.submissions.filter(s=>s.userId===user.id);const pending=isStudent?myAssignments.filter(a=>!mySubmissions.some(s=>s.assignmentId===a.id)).length:myAssignments.length;
      const pctFor=c=>{const done=Utils.validCompleted(d.progress.find(p=>p.userId===user.id&&p.courseId===c.id));const total=d.materials.filter(m=>m.courseId===c.id).length;return total?Math.round(done.length/total*100):0;};

    }
    async function courses(user){
      const d=await records();let list=d.courses;if(user.role==='teacher')list=list.filter(c=>c.teacherId===user.id);const decorated=await courseDecorate(list,d);const enrollments=d.enrollments.filter(e=>e.userId===user.id);

    async function courseDetail(user,id){
      const d=await records();const course=d.courses.find(c=>c.id===id);if(!course)return `${pageHead('Курс','Курс не найден','Возможно, он был удалён.') }<a class="btn" href="#/courses">К списку курсов</a>`;
      const enrolled=d.enrollments.some(e=>e.userId===user.id&&e.courseId===id);const owner=user.role==='admin'||(user.role==='teacher'&&course.teacherId===user.id);const materials=d.materials.filter(m=>m.courseId===id);const sections=d.sections.filter(s=>s.courseId===id).sort((a,b)=>(a.order||0)-(b.order||0));const progress=d.progress.find(p=>p.userId===user.id&&p.courseId===id);const done=new Set(Utils.validCompleted(progress));

      return `${pageHead('Учебный курс',esc(course.title),esc(course.description||''),enrollBtn)}${user.role==='student'&&enrolled?`<div class="card" style="margin-bottom:18px"><div class="progress-row"><strong>Прогресс по материалам</strong><span>${materials.length?Math.round(done.size/materials.length*100):0}%</span></div><div class="progress-track"><div class="progress-fill" style="width:${materials.length?Math.round(done.size/materials.length*100):0}%"></div></div></div>`:''}${tools}${blocks||empty('Разделов пока нет','Преподаватель добавит учебные материалы позже.')}${noSections}${editor}`;

    async function materialPage(user,id){
      const m=await Store.get('materials',id);if(!m)return `${pageHead('Материал','Файл не найден')}<a class="btn" href="#/courses">К курсам</a>`;

      const progress=(await Store.all('progress')).find(p=>p.userId===user.id&&p.courseId===m.courseId);const completed=Utils.validCompleted(progress).includes(m.id);
      let preview='';let filename=String(m.fileName||'').toLowerCase();
      if(m.fileBlob){if(materialPreviewUrl)URL.revokeObjectURL(materialPreviewUrl);materialPreviewUrl=URL.createObjectURL(m.fileBlob);const mime=m.mimeType||m.fileBlob.type||'';if(mime==='application/pdf'||filename.endsWith('.pdf'))preview=`<iframe class="file-preview" src="${esc(materialPreviewUrl)}" title="${esc(m.title)}"></iframe>`;else if(mime.startsWith('text/')||/\.(txt|md)$/i.test(filename)){const text=await m.fileBlob.text();preview=`<pre class="file-text" data-study-text>${esc(text)}</pre>`;}else preview=`<div class="notice">Предпросмотр недоступен. Скачайте файл и изучите его в подходящем приложении.</div>`;}else preview=`<div class="notice"><strong>${esc(m.type||'Материал')}</strong><p>${esc(m.description||'Преподаватель пока не добавил текст или файл к этому материалу.')}</p></div>`;

      return `${pageHead('Лекция',esc(m.title),esc(m.description||m.fileName||''),`<div class="form-actions" style="margin-top:0">${download}${aiTools}</div>`)}<div class="card"><div class="form-actions" style="margin-top:0;margin-bottom:16px"><a class="btn btn-sm" href="#/course/${encodeURIComponent(m.courseId)}">← ${esc(c?.title||'К курсу')}</a><span class="pill pill-muted">${esc(m.fileName||m.type||'Материал')}</span><span class="pill">${esc(c?.title||'Курс')}</span></div>${preview}</div><div class="card hidden" id="ai-output" aria-live="polite" style="margin-top:18px"></div>${finish}`;

      const users=d.users.map(u=>`<tr><td><strong>${esc(u.name)}</strong><br><span class="muted small">${esc(u.email)}</span></td><td><form data-form="role-update" data-user="${esc(u.id)}" class="inline-form"><select name="role" aria-label="Роль пользователя">${roleOptions(u.role)}</select><button class="btn btn-sm">Сохранить</button></form></td><td>${esc(Utils.date(u.createdAt))}</td></tr>`).join('');
      const courses=d.courses.map(c=>`<tr><td><strong>${esc(c.title)}</strong></td><td>${esc(d.users.find(u=>u.id===c.teacherId)?.name||'—')}</td><td>${d.enrollments.filter(e=>e.courseId===c.id).length}</td></tr>`).join('');
      return `${pageHead('Управление платформой','Администрирование','Пользователи, курсы и резервная копия данных.') }<div class="grid grid-3" style="margin-bottom:20px"><div class="card stat-card"><div><span class="muted small">Пользователей</span><div class="stat-number">${d.users.length}</div></div><div class="stat-icon">♙</div></div><div class="card stat-card"><div><span class="muted small">Курсов</span><div class="stat-number">${d.courses.length}</div></div><div class="stat-icon">▦</div></div><div class="card stat-card"><div><span class="muted small">Записей на курсы</span><div class="stat-number">${d.enrollments.length}</div></div><div class="stat-icon">↗</div></div></div><div class="grid grid-2"><section class="card"><h2>Добавить пользователя</h2><p class="small">Новый аккаунт будет создан с выбранной ролью.</p><form data-form="admin-user-create" class="grid" style="gap:12px"><div class="field"><label>Имя</label><input name="name" required maxlength="100"></div><div class="field"><label>Электронная почта</label><input name="email" type="email" required></div><div class="field"><label>Временный пароль</label><input name="password" type="password" required minlength="8"></div><div class="field"><label>Роль</label><select name="role"><option value="student">Студент</option><option value="teacher">Преподаватель</option><option value="admin">Администратор</option></select></div><button class="btn btn-primary">Создать пользователя</button></form></section><section class="card"><h2>Экспорт и импорт</h2><p>Резервная копия содержит пользователей, курсы, записи, материалы, задания, сдачи и оценки.</p><div class="form-actions"><button class="btn btn-primary" data-action="export">Экспортировать JSON</button><button class="btn" data-action="import">Импортировать JSON</button></div><p class="small muted">Импорт заменит текущие данные. Перед заменой браузер попросит подтверждение.</p></section></div><div class="section-head"><h2>Пользователи</h2></div><div class="table-wrap"><table><thead><tr><th>Участник</th><th>Роль</th><th>Создан</th></tr></thead><tbody>${users}</tbody></table></div><div class="section-head"><h2>Курсы</h2></div><div class="table-wrap"><table><thead><tr><th>Название</th><th>Преподаватель</th><th>Записано студентов</th></tr></thead><tbody>${courses||'<tr><td colspan="3">Курсов пока нет.</td></tr>'}</tbody></table></div>`;
    }
    return {login,layout,pageHead,empty};
  })();

  /* ============================== Events ============================== */
  function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=String(filename||'lecture-file').replace(/[\\/:*?"<>|]/g,'_');document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
  function downloadJSON(data){downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`kurs-or-backup-${new Date().toISOString().slice(0,10)}.json`);}
  async function exportData(){const data={};for(const n of Store.names)data[n]=await Store.all(n);data.materials=await Promise.all(data.materials.map(async material=>{if(!material.hasFile)return material;const full=await Store.get('materials',material.id);if(!(full?.fileBlob instanceof Blob))throw new Error('Не удалось прочитать файл '+(material.fileName||material.title));const {fileBlob,...metadata}=full;return {...metadata,fileBase64:await Utils.blobBase64(fileBlob)};}));downloadJSON({format:'kurs-or-backup',version:1,exportedAt:new Date().toISOString(),...data});Utils.toast('Резервная копия подготовлена.');}
  document.addEventListener('change',async event=>{if(event.target.matches('[data-language]')){I18n.set(event.target.value);await Router.render();return;}if(event.target.matches('[data-tutor-course]')){Utils.setTutorCourse(event.target.value);await Router.render();}});
  document.addEventListener('click',async event=>{
    const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;
    try{
      if(action==='signup-toggle'){const signup=!document.querySelector('[data-form="register"]');document.getElementById('app').innerHTML=Views.login(signup);I18n.apply(Utils.byId('app'));return;}
      if(action==='logout'){await Auth.logout();Router.go('login');return;}
      if(action==='theme'){const theme=document.body.dataset.theme==='dark'?'light':'dark';document.body.dataset.theme=theme;localStorage.setItem('course-platform-theme',theme);return;}
      if(action==='reload'){await Router.render();return;}
      if(action==='tutor-example'){const input=Utils.byId('tutor-message');if(input){input.value=button.dataset.prompt||'';input.focus();}return;}
      if(action==='enroll'){const user=await Auth.currentUser();if(!user||user.role!=='student')return;const courseId=button.dataset.id;if(!(await Store.all('enrollments')).some(e=>e.userId===user.id&&e.courseId===courseId))await Store.put('enrollments',{id:Utils.id('enroll'),userId:user.id,courseId});Router.render();Utils.toast('Вы записаны на курс.');return;}
      if(action==='material-download'){const user=await Auth.currentUser();const material=await Store.get('materials',button.dataset.id);if(!user||!material?.fileBlob)throw new Error('Файл не найден.');const course=await Store.get('courses',material.courseId);if(user.role==='student'&&!(await Store.all('enrollments')).some(e=>e.userId===user.id&&e.courseId===material.courseId))throw new Error('Запишитесь на курс, чтобы скачать лекцию.');if(user.role==='teacher'&&course?.teacherId!==user.id)throw new Error('Этот материал не относится к вашему курсу.');downloadBlob(material.fileBlob,material.fileName||material.title||'lecture-file');return;}
      if(action==='ai-summary'||action==='ai-quiz'){
        const user=await Auth.currentUser();if(!user)throw new Error('Войдите в аккаунт.');const output=Utils.byId('ai-output');if(!output)throw new Error('Откройте материал курса.');output.classList.remove('hidden');output.replaceChildren();const loading=document.createElement('p');loading.textContent=I18n.exact('Генерирую ответ…');output.append(loading);button.disabled=true;
        try{if(action==='ai-summary'){const result=await Store.ai('summary',{materialId:button.dataset.id,language:I18n.lang});output.replaceChildren();const title=document.createElement('h3');title.textContent=user.role==='student'?'Личный конспект ИИ':'Черновик конспекта · проверка преподавателя';const body=document.createElement('p');body.textContent=result.summary;body.style.whiteSpace='pre-wrap';const meta=document.createElement('p');meta.className='muted small';meta.textContent=`Источник: ${button.dataset.id} · модель: ${result.aiMetadata?.model||'—'} · создан: ${result.aiMetadata?.generatedAt||'—'} · версия: ${result.aiMetadata?.version||1} · статус: ${result.approvalStatus}`;output.append(title,body,meta);}else{const result=await Store.ai('quiz',{materialId:button.dataset.id,count:5,language:I18n.lang});const current=await Auth.currentUser();const quiz=await Store.put('quizzes',{id:Utils.id('quiz'),courseId:result.courseId,sourceMaterialId:result.materialId,title:result.title,questions:result.questions.map(q=>({id:Utils.id('question'),text:q.text,options:q.options,answer:q.answer,explanation:q.explanation})),...(current.role==='student'?{createdFor:current.id}:{}),aiGenerated:true});Router.go(`quiz/${encodeURIComponent(quiz.id)}`);Utils.toast(current.role==='student'?'Создан личный тренировочный тест.':'ИИ-черновик сохранён на проверку преподавателя.');return;}}finally{button.disabled=false;}return;
      }
      if(action==='ai-grade-feedback'){
        const result=await Store.ai('grade-feedback',{submissionId:button.dataset.submission,language:I18n.lang});const card=button.closest('.card');const input=card?.querySelector('[data-form="grade-submission"] [name="feedback"]');if(input)input.value=result.suggestion;let meta=card?.querySelector('[data-ai-feedback-meta]');if(!meta&&input){meta=document.createElement('small');meta.dataset.aiFeedbackMeta='true';meta.className='muted';input.insertAdjacentElement('afterend',meta);}if(meta)meta.textContent=`Черновик ИИ · источник: ${result.aiMetadata?.sourceSubmissionId} · модель: ${result.aiMetadata?.model} · создан: ${result.aiMetadata?.generatedAt} · версия: ${result.aiMetadata?.version} · статус: ${result.aiMetadata?.approvalStatus}. Проверьте текст и нажмите «Оценить», чтобы подтвердить.`;Utils.toast('Черновик комментария готов — проверьте его перед оценкой.');return;
      }
      if(action==='approve-ai-quiz'){const user=await Auth.currentUser();if(!user||!['teacher','admin'].includes(user.role))throw new Error('Подтверждение доступно преподавателю курса.');await Store.approveQuiz(button.dataset.id);await Router.render();Utils.toast('ИИ-тест проверен и опубликован.');return;}
      if(action==='export-grades'){
        const table=document.querySelector('[data-grades-table]');if(!table)throw new Error('Журнал оценок не найден.');const rows=[...table.rows].map(row=>[...row.cells].map(cell=>{let value=cell.innerText.trim().replace(/\s+/g,' ');if(/^[=+\-@\t\r]/.test(value))value="'"+value;return '"'+value.replace(/"/g,'""')+'"';}).join(';'));downloadBlob(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),`kurs-or-grades-${new Date().toISOString().slice(0,10)}.csv`);return;
      }
      if(action==='export'){await exportData();return;}
      if(action==='import'){Utils.byId('import-file').click();return;}
    }catch(error){console.error('Ошибка действия:',error);Utils.toast(error.message||'Не удалось выполнить действие.','error');}
  });
  document.addEventListener('submit',async event=>{
    const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();const type=form.dataset.form;
    try{const data=await Utils.readForm(form);const user=await Auth.currentUser();
      if(type==='login'){await Auth.login(data.email,data.password);Router.go('dashboard');return;}
      if(type==='register'){await Auth.register(data.name,data.email,data.password);Router.go('dashboard');Utils.toast('Аккаунт студента создан.');return;}
      if(type==='tutor-chat'){
        if(!user)throw new Error('Войдите в аккаунт.');const message=String(data.message||'').trim();if(message.length<2)throw new Error('Напишите вопрос репетитору.');const courseId=Utils.tutorCourse();if(!courseId)throw new Error(I18n.exact('Выберите курс, чтобы продолжить.'));const previous=await Store.get('ai_chats',`${user.id}:${courseId}`);const messages=[...(previous?.messages||[]),{role:'user',text:message}];let answer;
        try{const response=await Store.ai('chat',{courseId,message,history:(previous?.messages||[]).slice(-8),language:I18n.lang});answer=response.text;}catch(error){if(error.status!==503)throw error;const course=await Store.get('courses',courseId);answer=Utils.tutorReply(message,user.role,course?.title||'',(await Store.all('materials')).filter(m=>m.courseId===courseId).map(m=>({title:m.title,description:m.description||'',content:''})));}
        messages.push({role:'assistant',text:answer});await Store.put('ai_chats',{id:`${user.id}:${courseId}`,userId:user.id,courseId,messages});await Router.render();setTimeout(()=>{const chat=Utils.byId('tutor-chat');if(chat)chat.scrollTop=chat.scrollHeight;},0);return;
      }
      if(type==='material-reflection'){
        if(!user||user.role!=='student')return;const material=await Store.get('materials',form.dataset.material);if(!material)throw new Error('Материал не найден.');const reflection=String(data.reflection||'').trim();if(reflection.length<12)throw new Error('Объясните главную мысль материала своими словами.');await Store.completeStudy(material.id,reflection);Router.go(`course/${encodeURIComponent(material.courseId)}`);Utils.toast('Материал изучен, прогресс обновлён.');return;
      }
      if(type==='profile-update'){
        if(!user)throw new Error('Войдите в аккаунт.');const response=await Store.updateProfile(data);Auth.setCurrent(response.user);await Router.render();Utils.toast(I18n.exact('Профиль сохранён.'));return;
      }
      if(type==='course-create'){
        if(!user||!['admin','teacher'].includes(user.role))return;const course={id:Utils.id('course'),title:String(data.title).trim(),description:String(data.description).trim(),teacherId:user.role==='teacher'?user.id:String(data.teacherId||user.id),color:/^#[0-9a-f]{6}$/i.test(data.color)?data.color:'#6879e8'};if(!course.title)throw new Error('Укажите название курса.');await Store.put('courses',course);await Store.put('sections',{id:Utils.id('section'),courseId:course.id,title:'Общий раздел',order:1});Router.render();Utils.toast('Курс создан.');return;
      }
      if(type==='section-create'){
        const courseId=form.dataset.course;const course=await Store.get('courses',courseId);if(!user||(user.role!=='admin'&&!(user.role==='teacher'&&course?.teacherId===user.id)))return;const existing=(await Store.all('sections')).filter(s=>s.courseId===courseId);await Store.put('sections',{id:Utils.id('section'),courseId,title:String(data.title).trim(),order:existing.length+1});Router.render();Utils.toast('Раздел добавлен.');return;
      }
      if(type==='material-create'){
        const courseId=form.dataset.course;const course=await Store.get('courses',courseId);if(!user||(user.role!=='admin'&&!(user.role==='teacher'&&course?.teacherId===user.id)))return;if(!String(data.title).trim())throw new Error('Укажите название материала.');const file=data.file;let attachment={};if(file&&typeof file.size==='number'&&file.size){const ext=String(file.name).split('.').pop().toLowerCase();const types={pdf:'application/pdf',txt:'text/plain',md:'text/markdown',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',odt:'application/vnd.oasis.opendocument.text',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation'};if(!types[ext])throw new Error('Формат файла не поддерживается. Выберите PDF, TXT, MD, DOCX, ODT или PPTX.');if(file.size>20*1024*1024)throw new Error('Размер файла не должен превышать 20 МБ.');const mime=file.type||types[ext];attachment={fileName:file.name,mimeType:mime,fileBlob:file.slice(0,file.size,mime)};}await Store.put('materials',{id:Utils.id('material'),courseId,sectionId:data.sectionId,title:String(data.title).trim(),type:data.type,description:String(data.description||'').trim(),...attachment});Router.render();Utils.toast('Материал добавлен.');return;
      }
      if(type==='assignment-create'){
        if(!user||!['admin','teacher'].includes(user.role))return;const course=await Store.get('courses',data.courseId);if(!course||(user.role==='teacher'&&course.teacherId!==user.id))throw new Error('Выберите свой курс.');await Store.put('assignments',{id:Utils.id('assignment'),courseId:data.courseId,title:String(data.title).trim(),description:String(data.description).trim(),due:data.due||'',createdBy:user.id});Router.render();Utils.toast('Задание опубликовано.');return;
      }
      if(type==='submission'){
        if(!user||user.role!=='student')return;const assignmentId=form.dataset.assignment;const assignment=await Store.get('assignments',assignmentId);if(!assignment)throw new Error('Задание не найдено.');const answer=String(data.text||'').trim();if(answer.length<10)throw new Error('Ответ должен содержать не менее 10 символов.');await Store.submitAssignment(assignmentId,{text:answer});Router.render();Utils.toast('Ответ отправлен.');return;
      }
      if(type==='grade-submission'){
        if(!user||!['admin','teacher'].includes(user.role))return;const submission=await Store.get('submissions',form.dataset.submission);if(!submission)throw new Error('Сдача не найдена.');const grade=Number(data.grade);if(!Number.isFinite(grade)||grade<0||grade>100)throw new Error('Оценка должна быть от 0 до 100.');await Store.gradeSubmission(submission.id,{grade,feedback:String(data.feedback||'').trim()});Router.render();Utils.toast('Оценка сохранена.');return;
      }
      if(type==='quiz-create'){
        if(!user||!['admin','teacher'].includes(user.role))return;const course=await Store.get('courses',data.courseId);if(!course||(user.role==='teacher'&&course.teacherId!==user.id))throw new Error('Выберите свой курс.');const options=[data.option0,data.option1,data.option2].map(x=>String(x).trim());if(options.some(x=>!x))throw new Error('Заполните все варианты ответа.');await Store.put('quizzes',{id:Utils.id('quiz'),courseId:data.courseId,sourceMaterialId:data.sourceMaterialId,title:String(data.title).trim(),questions:[{id:Utils.id('question'),text:String(data.question).trim(),options,answer:Number(data.answer)}]});Router.render();Utils.toast('Тест создан.');return;
      }
      if(type==='quiz-attempt'){
        if(!user||user.role!=='student')return;const quiz=await Store.get('quizzes',form.dataset.quiz);if(!quiz)throw new Error('Тест не найден.');const questions=quiz.questions||[];const answers={};for(const question of questions){const selected=data[question.id];if(selected===undefined)throw new Error('Ответьте на все вопросы.');answers[question.id]=Number(selected);}const result=await Store.submitQuiz(quiz.id,{answers});await Router.render();Utils.toast(`Результат: ${result.correct} из ${result.total} (${result.score}%).`);return;
      }
      if(type==='role-update'){
        if(!user||user.role!=='admin')return;await Store.updateRole(form.dataset.user,data.role);await Router.render();Utils.toast('Роль пользователя обновлена.');return;
      }
      if(type==='admin-user-create'){
        if(!user||user.role!=='admin')return;await Store.adminCreateUser({name:data.name,email:data.email,role:data.role,password:data.password});await Router.render();Utils.toast('Пользователь создан.');return;
      }
    }catch(error){console.error('Ошибка формы:',error);Utils.toast(error.message||'Не удалось сохранить данные.','error');}
  });
  Utils.byId('import-file').addEventListener('change',async event=>{
    const file=event.target.files?.[0];event.target.value='';if(!file)return;
    try{const user=await Auth.currentUser();if(!user||user.role!=='admin')throw new Error('Импорт доступен администратору.');if(!confirm('Импорт заменит данные платформы. Пользователи и пароли сохранятся. Продолжить?'))return;const payload=JSON.parse(await file.text());await Store.importData(payload);await Auth.logout();Router.go('login');Utils.toast('Данные импортированы. Войдите снова.');}
    catch(error){console.error('Ошибка импорта:',error);Utils.toast(error.message||'Не удалось импортировать файл.','error');}
  });

  /* ============================== Start ============================== */
  (async()=>{
    try{await Store.init();document.body.dataset.theme=localStorage.getItem('course-platform-theme')||'light';Router.start();}
    catch(error){console.error('Ошибка запуска платформы:',error);Utils.byId('app').className='content';Utils.byId('app').innerHTML=`<div class="card" style="max-width:680px;margin:8vh auto"><span class="eyebrow">Запуск не выполнен</span><h1>Сервер недоступен</h1><p class="muted">${Utils.esc(error.message||'Запустите сервер командой node server.mjs и обновите страницу.')}</p><p class="small muted">Для общей базы и входа нескольких пользователей откройте сайт по адресу http://localhost:3000.</p><button class="btn btn-primary" data-action="reload">Повторить подключение</button></div>`;}
  })();
  </script>
